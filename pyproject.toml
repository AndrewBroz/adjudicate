[project]
name = "adjudicate"
version = "0.2.3"
description = "Bounded, auditable text edits chosen by a local language model: detector proposes, model picks, applier splices."
requires-python = ">=3.11"
dependencies = ["spylls>=0.1.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adjudicate"]
include = ["adjudicate/dict/*"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

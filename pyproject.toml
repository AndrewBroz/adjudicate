[project]
name = "adjudicate"
version = "0.1.0"
description = "Bounded, auditable text edits chosen by a local language model: detector proposes, model picks, applier splices."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adjudicate"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
